# .codex/config.toml
#
# Project-scoped Codex configuration.
# This file is loaded only when the repo is trusted by Codex.
#
# Do not put product runtime rules here.
# Product/runtime AI rules live in /AI/AGENTS.md and /AI/docs.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Runtime product RAG uses no web fallback.
# Keep Codex web search disabled by default so it does not accidentally treat
# external web content as part of the product policy.
#
# If a one-off task needs current library docs, enable web search explicitly
# from the CLI/session for that task only.
web_search = "disabled"

developer_instructions = """
Follow the repository AGENTS.md hierarchy.

For work under AI/, read /AI/AGENTS.md first.
For AI code review tasks, read /AI/prompts/code-reviewer.md before reviewing.

Do not add runtime web fallback to the AI RAG flow.
Do not store final source-of-truth data in Redis.
Do not put large JSON artifacts directly into MySQL.
"""

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 1