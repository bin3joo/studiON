spring:
  profiles:
    include: secret
  application:
    name: studion

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/studion
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:metadata/position-data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: 27017
      database: studion

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}

websocket:
  endpoint: /ws/projects
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173