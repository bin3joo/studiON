spring:
  profiles:
    include: secret

  application:
    name: studion

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      data-locations: classpath:metadata/position-data.sql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT}
      database: ${MONGODB_DB}
      uri: ${MONGODB_URI:mongodb://localhost:27017/studion}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
    tmp-expiration: ${JWT_TMP_EXPIRATION:300000}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

    region:
      static: ap-northeast-2

    s3:
      bucket: ${AWS_S3_BUCKET}
      upload-url-expiration-minutes: ${AWS_UPLOAD_URL_EXPIRATION_MINUTES}

cdn:
  domain: ${CDN_DOMAIN}

websocket:
  endpoint: /ws/projects
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.salmon.studion: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security: DEBUG

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  audio:
    # TODO: 유저테스트 전용 임시 추가 (추후 삭제 필요 - 현재 100MB)
    temp-user-total-limit-bytes: ${TEMP_USER_TOTAL_AUDIO_LIMIT_BYTES:104857600}

  audio-version:
    ffmpeg-binary: ${AUDIO_VERSION_FFMPEG_BINARY:ffmpeg}

ai:
  fastapi:
    base-url: ${FASTAPI_URL:http://localhost:8000/api/v1}
    timeout-seconds: 5
