spring:
  application:
    name: studion

  profiles:
    include: secret

  # 데이터베이스 설정
  datasource:
    url: jdbc:mysql://localhost:3307/studion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true  # 로컬에서 SQL 쿼리 로그 출력
    properties:
      hibernate:
        format_sql: true  # SQL 쿼리를 보기 좋게 포맷팅
        dialect: org.hibernate.dialect.MySQL8Dialect

  # NoSQL 데이터베이스 설정
  data:
    mongodb:
      uri: mongodb://localhost:27017/studion
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always
      data-locations: classpath:metadata/position-data.sql

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub  # 구글 고유 사용자 ID

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000  # 24시간

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
    # ✅ 로컬에서 AWS SDK 자동 설정 오류 방지
    stack:
      auto: false
    instance:
      data: false

websocket:
  endpoint: /ws/projects
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

# ✅ 로컬 디버깅용 로깅
logging:
  level:
    root: INFO
    com.yourpackage.studion: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security: DEBUG