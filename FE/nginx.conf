# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name k14a205.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name k14a205.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/k14a205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14a205.p.ssafy.io/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}