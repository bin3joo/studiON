services:
  frontend-blue:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    container_name: studion-frontend-blue
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - studion-net
    restart: unless-stopped

  backend-blue:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: studion-backend-blue
    env_file:
      - .env.prod
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_PORT: 8080
      REDIS_HOST: studion-redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - studion-net
    restart: unless-stopped

networks:
  studion-net:
    external: true
