services:
  frontend-blue:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    container_name: studion-frontend-blue
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - studion-net
    restart: on-failure:2

  backend-blue:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: studion-backend-blue
    env_file:
      - .env.prod
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MONGODB_DB: ${MONGO_DB}
      MONGODB_PORT: 27017
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - studion-net
    restart: on-failure:2

networks:
  studion-net:
    external: true
