services:
  nginx:
    build:
      context: ./FE
      target: runtime
    ports:
      - "80:80"
      - "443:443"
    restart: on-failure:2
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_started

  certbot:
    image: certbot/certbot
    entrypoint: >
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email dev.seoliee49@gmail.com
      --agree-tos
      --no-eff-email
      -d studion.ai.kr
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  backend:
    build: ./BE
    env_file:
      - .env.prod
    restart: on-failure:2

  ai:
    build: ./AI
    env_file:
      - .env.prod
    restart: on-failure:2
    
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env.prod
    restart: on-failure:2
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
