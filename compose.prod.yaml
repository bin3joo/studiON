services:
  redis:
    image: redis:7
    container_name: redis
    env_file:
      - .env.prod
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    restart: on-failure:2
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - studion-net

networks:
  studion-net:
    name: studion-net

volumes:
  redis_data:
