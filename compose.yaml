services:
  nginx:
    build: ./FE
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  backend:
    build: ./BE

  ai:
    build: ./AI

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  certbot_certs:
  certbot_www:
  redis_data:
