services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./FE/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - fe_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started

  frontend:
    build:
      context: ./FE
      target: exporter
    volumes:
      - fe_dist:/dist

  certbot: 
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  backend:
    build: ./BE

  ai:
    build: ./AI

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  certbot_certs:
  certbot_www:
  redis_data:
  fe_dist:
